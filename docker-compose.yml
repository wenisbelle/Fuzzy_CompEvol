version: '3.8'

services:
  vision_dev:
    image: fuzzy_ga:latest
    container_name: fuzzy_ga_container
    hostname: fuzzy_ga_container
    environment:
      - QT_X11_NO_MITSHM=1
      - DISPLAY
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./src:/FuzzyGA/src:rw  # Mount the current directory as readable and writable
              
    stdin_open: true
    tty: true
    restart: "no"
    network_mode: "host"  # Add this line to use the host network
    command: /bin/bash  # Add this line to start a bash shell
